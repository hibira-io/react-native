name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Package contents
        run: npm pack --dry-run

  # Bundles the Expo example with Metro for iOS and Android, using the packed
  # package as an app would install it from npm.
  expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm pack
      - working-directory: example
        run: |
          npm pkg delete 'dependencies.@hibira-io/react-native'
          npm install
          npm install --no-save ../hibira-io-react-native-*.tgz
      - working-directory: example
        run: npx expo export --platform ios --platform android --output-dir dist
        env:
          CI: "1"
          EXPO_PUBLIC_HIBIRA_KEY: ci
