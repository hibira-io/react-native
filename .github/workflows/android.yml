# Builds e2e/android (an Expo app on the packed package) as a release APK and
# runs it on an Android emulator: connection, chunked events both ways under a
# 4 KB limit, presence, the background disconnect and reconnect, and push
# registration. First against soketi in a service container; then, when the
# HIBIRA_E2E_* secrets are set, against ws.hibira.io (native Origin, Free plan
# limit, Hibira Push). GOOGLE_SERVICES_JSON adds real FCM delivery.
name: android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      soketi:
        image: quay.io/soketi/soketi:1.6-16-debian
        ports: ["6001:6001"]
        env:
          SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "true"
          SOKETI_EVENT_MAX_SIZE_IN_KB: "4"
    env:
      HIBIRA_E2E_APP_ID: ${{ secrets.HIBIRA_E2E_APP_ID }}
      HIBIRA_E2E_KEY: ${{ secrets.HIBIRA_E2E_KEY }}
      HIBIRA_E2E_SECRET: ${{ secrets.HIBIRA_E2E_SECRET }}
      HIBIRA_E2E_PUSH_INSTANCE: ${{ secrets.HIBIRA_E2E_PUSH_INSTANCE }}
      HIBIRA_E2E_PUSH_SECRET: ${{ secrets.HIBIRA_E2E_PUSH_SECRET }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      HIBIRA_E2E_FCM: ${{ secrets.GOOGLE_SERVICES_JSON != '' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm pack
      - name: Firebase config
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > e2e/android/google-services.json
      - name: Install the e2e app
        working-directory: e2e/android
        run: |
          npm install
          npm install --no-save ../../hibira-io-react-native-*.tgz
      - name: Build the release APK
        working-directory: e2e/android
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        env:
          CI: "1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash e2e/android/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e
          path: e2e/android/out
          if-no-files-found: ignore
